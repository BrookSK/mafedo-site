<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110" fill="none" role="img" aria-label="Mafedo Engenharia">
  <!-- Edifícios ao fundo: contornos finos (laranja), alturas escalonadas -->
  <g stroke="#F56208" stroke-width="1.8" stroke-linejoin="round">
    <path d="M38 56 V26 L49 19 V56"/>
    <path d="M49 56 V21 L60 14 V56"/>
    <path d="M60 56 V18 L69 12 V56"/>
  </g>

  <!-- "M" arquitetônico afiado -->
  <!-- Perna esquerda + diagonal interna (contorno laranja aberto) -->
  <path d="M20 90 V50 L41 66"
        stroke="#F56208" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vale central e lado direito preenchidos em branco (formas sólidas, pontudas) -->
  <path d="M41 66 L50 48 L50 90 L42 90 L42 70 Z" fill="#FEFEFE"/>
  <path d="M50 48 L59 66 L59 90 L50 90 Z" fill="#FEFEFE"/>
  <path d="M59 66 L80 50 V90 L59 90 Z" fill="#FEFEFE"/>

  <!-- Linha-base fina (laranja) -->
  <line x1="20" y1="98" x2="80" y2="98" stroke="#F56208" stroke-width="1.6" stroke-linecap="round"/>
</svg>
